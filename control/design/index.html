<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
	<!-- Load helper.css to use our helper classes.
	<link href="../../../../styles/helper.css" rel="stylesheet">
	-->
	
	<!-- JS -->
	<script src="../../../../scripts/buildfire.min.js"></script>
   
 	<!--
    <script src="../../../../scripts/angular/angular.min.js"></script>
    <script src="../../../../scripts/angular/ui-bootstrap.min.js"></script>

    <script src="../../../../scripts/jquery/jquery-1.11.2.min.js"></script>
    -->
</head>
<body>
    <h2>Guides appearance and behavior</h2>
    <p>Settings apply to the shared guide template and downloaded HTML previews. Save, then reopen the widget to see changes.</p>
    <form id="appearance-form">
        <fieldset id="appearance-fields" disabled>
            <label><input id="achievementEnabled" type="checkbox"> Show achievement popup when a topic or section is completed</label>
            <small>The ending card is configured separately under Content → Organization.</small>
            <div id="colors" class="colors"></div>
            <button class="btn primary" type="submit">Save appearance</button>
        </fieldset>
    </form>
    <p id="status" role="status">Loading settings…</p>
    <style>
        body{font:14px system-ui,sans-serif;color:#303744;padding:20px;max-width:760px}
        fieldset{border:0;padding:0}
        label{display:block;margin:16px 0}
        input[type=color]{vertical-align:middle;margin-right:12px}
        button{font:inherit;cursor:pointer}
        small{display:block;color:#596170;margin-top:5px}
        .colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 20px;margin-bottom:16px}
        #status{margin:16px 0}
        .btn{padding:9px 14px;border:1px solid #cfd5dd;border-radius:7px;color:#303744;background:#fff;font-weight:650}
        .btn:hover{background:#f6f7f9}
        .btn.primary{border-color:#356fd0;color:#fff;background:#356fd0}
        .btn.primary:hover{background:#2e61b7}
        .btn:disabled{opacity:0.55;cursor:wait}
    </style>
    <script src="../../shared/guides-translations.js"></script>
    <script src="settings.js"></script>
</body>
</html>
